<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Our Week</title>
  <meta name="description" content="Seal a week of photos with your people. Open it together." />
  <meta name="theme-color" content="#1B1A2C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Week" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <script>
    // Error reporter. If anything fails, the reason shows on screen instead of a blank page.
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return; shown = true;
        var v = document.getElementById("view");
        if (!v) return;
        v.innerHTML = '<div style="padding:40px 20px;font-family:system-ui;max-width:600px;margin:0 auto">' +
          '<h1 style="font-size:1.4rem;margin:0 0 10px">Something didn\'t load</h1>' +
          '<p style="opacity:.75;margin:0 0 14px">Copy this and send it to Claude:</p>' +
          '<pre style="white-space:pre-wrap;background:rgba(255,255,255,.08);padding:14px;border-radius:10px;font-size:.85rem">' +
          String(msg).replace(/</g, "&lt;") + '</pre></div>';
      }
      window.__showFatal = show;
      window.addEventListener("error", function (e) { show((e.message || "Unknown error") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "")); });
      window.addEventListener("unhandledrejection", function (e) { show(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
      setTimeout(function () {
        var v = document.getElementById("view");
        if (v && !v.innerHTML.trim()) show("The app never started (no error was thrown). Check that " + location.origin + "/app.js and " + location.origin + "/config.js open in the browser. If they 404, the files are in a subfolder: set Root Directory in Vercel > Settings > General.");
      }, 7000);
    })();
  </script>

  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabs-home" class="tabs" hidden>
      <button data-tab="home" class="tab is-active" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
        <span>Home</span>
      </button>
      <button data-tab="circles" class="tab" aria-label="Circles">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>
        <span>Circles</span>
      </button>
      <button data-tab="me" class="tab" aria-label="Me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Me</span>
      </button>
    </nav>
    <nav id="tabs" class="tabs" hidden>
      <button data-tab="week" class="tab is-active" aria-label="This week">
        <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 15l4.2-4.2a1 1 0 0 1 1.4 0L14 15"/><path d="M13 14l2-2a1 1 0 0 1 1.4 0L20 15.6"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>
        <span>Week</span>
      </button>
      <button data-tab="reveal" class="tab" aria-label="Reveal">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>Reveal</span>
      </button>
      <button data-tab="past" class="tab" aria-label="Past weeks">
        <svg viewBox="0 0 24 24"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M3 4h18v3H3z"/><path d="M10 11h4"/></svg>
        <span>Past</span>
      </button>
      <button data-tab="map" class="tab" aria-label="Map">
        <svg viewBox="0 0 24 24"><path d="M12 21s6-5.5 6-11a6 6 0 0 0-12 0c0 5.5 6 11 6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <span>Map</span>
      </button>
      <button data-tab="people" class="tab" aria-label="People">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg>
        <span>People</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" hidden></div>
  <input id="file-input" type="file" accept="image/*" multiple hidden />

  <script type="module" src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
